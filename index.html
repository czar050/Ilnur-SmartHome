<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ilnur SmartHome</title>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #101114;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .connection {
            text-align: center;
            color: #888;
            margin-bottom: 25px;
        }

        .card {
            background: #1b1d22;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 20px;
            margin-bottom: 20px;
        }

        .led-status {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .led {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #444;
        }

        .led.on {
            background: #00ff66;
            box-shadow: 0 0 15px #00ff66;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .on-button {
            background: #00c853;
            color: white;
        }

        .off-button {
            background: #d32f2f;
            color: white;
        }

        .sensors {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .sensor {
            background: #25282f;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
        }

        .sensor-icon {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .sensor-value {
            font-size: 28px;
            font-weight: bold;
        }

        .sensor-name {
            margin-top: 6px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Ilnur SmartHome</h1>

    <div class="connection" id="connectionStatus">
        Подключение...
    </div>

    <div class="card">
        <div class="card-title">💡 Светодиод</div>

        <div class="led-status">
            <div class="led" id="ledIndicator"></div>
            <span id="ledStatus">Выключен</span>
        </div>

        <div class="buttons">
            <button class="on-button" onclick="setLed('ON')">
                Включить
            </button>

            <button class="off-button" onclick="setLed('OFF')">
                Выключить
            </button>
        </div>
    </div>

    <div class="card">
        <div class="card-title">🌡️ Датчики</div>

        <div class="sensors">

            <div class="sensor">
                <div class="sensor-icon">🌡️</div>
                <div class="sensor-value" id="temperature">
                    -- °C
                </div>
                <div class="sensor-name">
                    Температура
                </div>
            </div>

            <div class="sensor">
                <div class="sensor-icon">💧</div>
                <div class="sensor-value" id="humidity">
                    -- %
                </div>
                <div class="sensor-name">
                    Влажность
                </div>
            </div>

        </div>
    </div>

</div>

<script>

    const MQTT_URL = "wss://broker.emqx.io:8084/mqtt";

    const LED_SET_TOPIC = "promvr/nodemcu/led/set";
    const LED_STATE_TOPIC = "promvr/nodemcu/led/state";

    const TEMPERATURE_TOPIC =
        "promvr/nodemcu/dht11/temperature";

    const HUMIDITY_TOPIC =
        "promvr/nodemcu/dht11/humidity";

    const connectionStatus =
        document.getElementById("connectionStatus");

    const ledIndicator =
        document.getElementById("ledIndicator");

    const ledStatus =
        document.getElementById("ledStatus");

    const temperatureElement =
        document.getElementById("temperature");

    const humidityElement =
        document.getElementById("humidity");


    const client = mqtt.connect(MQTT_URL);


    client.on("connect", () => {

        connectionStatus.textContent =
            "● Подключено";

        connectionStatus.style.color =
            "#00c853";

        client.subscribe([
            LED_STATE_TOPIC,
            TEMPERATURE_TOPIC,
            HUMIDITY_TOPIC
        ]);

    });


    client.on("reconnect", () => {

        connectionStatus.textContent =
            "Подключение...";

        connectionStatus.style.color =
            "#ff9800";

    });


    client.on("offline", () => {

        connectionStatus.textContent =
            "● Нет подключения";

        connectionStatus.style.color =
            "#d32f2f";

    });


    client.on("message", (topic, message) => {

        const value = message.toString();


        if (topic === LED_STATE_TOPIC) {

            updateLed(value);

        }


        if (topic === TEMPERATURE_TOPIC) {

            temperatureElement.textContent =
                parseFloat(value).toFixed(1) + " °C";

        }


        if (topic === HUMIDITY_TOPIC) {

            humidityElement.textContent =
                parseFloat(value).toFixed(1) + " %";

        }

    });


    function setLed(state) {

        if (!client.connected) {
            return;
        }

        client.publish(
            LED_SET_TOPIC,
            state
        );

    }


    function updateLed(state) {

        if (state === "ON") {

            ledIndicator.classList.add("on");

            ledStatus.textContent =
                "Включен";

        } else {

            ledIndicator.classList.remove("on");

            ledStatus.textContent =
                "Выключен";

        }

    }

</script>

</body>
</html>
